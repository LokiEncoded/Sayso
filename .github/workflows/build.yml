# Builds and tests Sayso on every push to main and every pull request.
# Runs on Windows because Sayso is a Windows app.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Upload runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: sayso-jar
          path: target/sayso.jar
          retention-days: 14
